<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Resume - {{name}}</title>
    <style>
      body { font-family: Inter, Arial, sans-serif; margin: 32px; color: #111; }
      header { display:flex; justify-content:space-between; align-items:center; }
      h1 { margin:0; font-size:28px }
      .contact { color:#555 }
      .section { margin-top:18px }
      .skills { display:flex; gap:8px; flex-wrap:wrap }
      .skill { background:#f3f4f6; padding:6px 10px; border-radius:999px; font-size:13px }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>{{name}}</h1>
        <div class="contact">{{email}}</div>
      </div>
      <div style="text-align:right">Resume</div>
    </header>
    <div class="section">
      <h3>Summary</h3>
      <div>{{summary}}</div>
    </div>
    <div class="section">
      <h3>Skills</h3>
      <div class="skills">{{skills}}</div>
    </div>
    <div class="section">
      <h3>Experience</h3>
      <ul>
        <li>Example Internship — Company (Summer 2024)</li>
      </ul>
    </div>
  </body>
</html>
